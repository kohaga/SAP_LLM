<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP AI Assistant</title>
  <style>
    :root { color-scheme:light; --blue:#0a6ed1; --navy:#25476a; --line:#d7e0e8; --bg:#edf2f6; --text:#263d52; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9eff4; font:14px/1.5 "Segoe UI",Arial,sans-serif; color:var(--text); }
    .app { height:100dvh; min-height:380px; width:100%; max-width:580px; margin:auto; background:#fff; display:flex; flex-direction:column; box-shadow:0 2px 20px #223e561a; }
    header { background:#f5f8fa; border-bottom:1px solid #cdd8e2; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 6px #1234; }
    .brand { display:flex; align-items:center; gap:11px; }
    .logo { display:grid; place-items:center; height:38px; width:46px; background:var(--blue); color:white; border-radius:6px; font-weight:800; font-size:14px; letter-spacing:-.7px; }
    header h1 { margin:0; color:#153d60; font-size:17px; letter-spacing:.1px; font-weight:650; }
    header small { color:#61798d; font-size:11px; }
    .status { display:flex; gap:6px; align-items:center; color:#526d80; font-size:11px; white-space:nowrap; }
    .dot { height:7px; width:7px; background:#30966f; border-radius:50%; }
    #messages { flex:1; min-height:0; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:12px; background:linear-gradient(#f7fafc,#eff5f8); }
    .bubble { padding:11px 13px; max-width:92%; border-radius:11px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 3px #17354a12; }
    .user { background:#d8eafb; color:#183b57; align-self:flex-end; border:1px solid #c1dff5; border-bottom-right-radius:3px; }
    .bot { background:white; border:1px solid #dce5ec; align-self:flex-start; border-bottom-left-radius:3px; }
    footer { border-top:1px solid var(--line); background:#fff; padding:12px; display:flex; align-items:flex-end; gap:9px; }
    textarea { flex:1; min-width:0; resize:none; border:1px solid #b9cad7; border-radius:8px; padding:10px 12px; font:inherit; max-height:110px; min-height:43px; outline:none; background:#fafcfd; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 2px #0a6ed122; }
    button { background:var(--blue); color:white; border:1px solid #0759ac; border-radius:8px; padding:11px 16px; cursor:pointer; font:inherit; font-weight:600; }
    button:hover:not(:disabled) { background:#085ba9; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .hint { color:#7990a0; font-size:11px; text-align:center; background:#fff; padding:0 6px 9px; }
    @media(max-width:340px) { .status {display:none;} header {padding:13px;} }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><div class="logo">SAP</div><div><h1>AI Assistant</h1><small>SAP GUI · Helyi asszisztens</small></div></div><div class="status"><span class="dot"></span>POC</div></header>
    <section id="messages" aria-live="polite">
      <div class="bubble bot">Szia! Miben segíthetek az SAP-ban?</div>
    </section>
    <form id="chat-form">
      <footer>
        <textarea id="input" rows="1" placeholder="Írj egy kérdést..." aria-label="Üzenet"></textarea>
        <button id="send" type="submit">Küldés</button>
      </footer>
    </form>
    <div class="hint">Enter: küldés · Shift+Enter: új sor</div>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const messages = document.getElementById('messages');
    function addMessage(text, who) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + who;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      addMessage(message, 'user');
      input.value = '';
      send.disabled = true;
      const pending = addMessage('Válasz készül…', 'bot');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message})
        });
        if (!response.ok) {
          let detail = 'HTTP ' + response.status;
          try { const err = await response.json(); detail = err.detail || detail; } catch (_) {}
          throw new Error(detail);
        }
        const data = await response.json();
        pending.textContent = data.reply ?? 'Nem érkezett válasz.';
      } catch (error) {
        pending.textContent = 'Kapcsolódási hiba: ' + error.message;
      } finally {
        send.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
